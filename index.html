<link rel="preconnect" href="https://fonts.googleapis.com">

  <symbol id="i-basket" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3.8 12h16.4M12 3.8c-4 4.6-4 11.8 0 16.4M12 3.8c4 4.6 4 11.8 0 16.4" fill="none" stroke="currentColor" stroke-width="1.3"/></symbol>

</svg>

<div class="grain" aria-hidden="true"></div>

<header class="topbar">
  <a class="brand" href="#/" aria-label="Housebets Sportsbook, go to home">
    <span class="brand-mark" aria-hidden="true"><svg width="30" height="23"><use href="#i-wave"/></svg></span>
    <span class="brand-type">housebets<span class="brand-sub">sportsbook</span></span>
  </a>

  <button class="searchbtn" id="searchOpen" aria-label="Search teams, players, competitions or markets">
    <svg width="16" height="16" aria-hidden="true"><use href="#i-search"/></svg>
    <span class="searchbtn-txt">Search teams, players, competitions, markets</span>
    <kbd>⌘K</kbd>
  </button>

  <div class="topmeta">
    <button class="balance" id="balanceChip" aria-label="Demo balance in USDT">
      <span class="balance-dot" aria-hidden="true"></span>
      <span class="balance-val" id="balanceVal">0.00</span>
      <span class="balance-cur">USDT</span>
    </button>
    <button class="iconbtn" id="alertsBtn" aria-label="Notifikasi"><svg width="19" height="19"><use href="#i-bell"/></svg><span class="dot-badge" aria-hidden="true"></span></button>
    <button class="avatar" id="userBtn" aria-label="Demo account">R</button>
  </div>
</header>

<div class="shell">
  <aside class="rail" id="rail" aria-label="Navigasi utama">
    <nav class="rail-main" id="railNav"></nav>
    <div class="rail-sep" role="presentation"></div>
    <div class="rail-label">Sports</div>
    <nav class="rail-sports" id="railSports"></nav>
    <div class="rail-foot">
      <div class="rail-note">
        <svg width="15" height="15" aria-hidden="true"><use href="#i-shield"/></svg>
        <span>Sample data · demo money<br>Not real betting</span>
      </div>
    </div>
  </aside>

  <main class="content" id="view" tabindex="-1"></main>

  <aside class="sidepanel" id="sidepanel" aria-label="Panel samping">
    <div id="panelBody"></div>
    <div class="panel-foot">
      <svg width="14" height="14" aria-hidden="true"><use href="#i-shield"/></svg>
      <span>Contest prototype · no login, no real money</span>
    </div>
  </aside>
</div>

<nav class="mtabs" aria-label="Navigasi bawah">
  <a class="mtab" href="#/" data-tab="home"><svg width="21" height="21"><use href="#i-home"/></svg><span>Home</span></a>
  <a class="mtab" href="#/live" data-tab="live"><svg width="21" height="21"><use href="#i-live"/></svg><span>Live</span></a>
  <a class="mtab" href="#/football" data-tab="football"><svg width="21" height="21"><use href="#i-ball"/></svg><span>Football</span></a>
  <a class="mtab" href="#/bets" data-tab="bets"><svg width="21" height="21"><use href="#i-ticket"/></svg><span>Bets</span></a>
</nav>

<button class="slipbar" id="slipBar" hidden>
  <span class="slipbar-count"><span id="slipBarCount">0</span></span>
  <span class="slipbar-copy"><b>Bet slip</b><span id="slipBarMeta">0.00 USDT</span></span>
  <span class="slipbar-cta">View slip <svg width="16" height="16"><use href="#i-arrow-r"/></svg></span>
</button>

<div class="scrim" id="scrim" hidden></div>

<aside class="drawer" id="drawer" aria-label="Bet slip" aria-hidden="true">
  <div class="drawer-grip" aria-hidden="true"></div>
  <div id="drawerBody" class="drawer-body"></div>
</aside>

<div class="palette" id="palette" hidden role="dialog" aria-modal="true" aria-label="Pencarian">
  <div class="palette-card">
    <div class="palette-in">
      <svg width="18" height="18" aria-hidden="true"><use href="#i-search"/></svg>
      <input id="paletteInput" type="text" placeholder="Teams, players, competitions, markets…" autocomplete="off" spellcheck="false" />
      <kbd>esc</kbd>
    </div>
    <div class="palette-results" id="paletteResults"></div>
    <div class="palette-foot">
      <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span><span><kbd>↵</kbd> open</span><span>No AI search · sample data</span>
    </div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<noscript>
  <div style="position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:#050F14;color:#EAF1F0;font-family:system-ui,sans-serif;text-align:center;padding:24px">
    <div><h1 style="font-size:22px;margin-bottom:8px">Enable JavaScript</h1>
    <p style="font-size:13px;color:#7E969A;max-width:36ch">This prototype runs entirely in your browser. Nothing is sent anywhere.</p></div>
  </div>
</noscript>
</body>
</html>
